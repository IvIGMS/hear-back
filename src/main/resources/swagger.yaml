openapi: 3.0.2
info:
  title: HearApp
  version: v1
tags:
  - name: auth
    description: Endpoints de autenticación
  - name: tags
    description: Endpoints de gestión de tags
  - name: spaces
    description: Endpoints de gestión de spaces
  - name: voice-notes
    description: Endpoints de gestión voice notes
security:
  - bearerAuth: []
paths:
  /voice-notes/{id}/stream:
    get:
      summary: Stream de una nota de voz (MP3)
      operationId: streamVoiceNote
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: Range
          in: header
          required: false
          schema:
            type: string
            example: 100
          description: Rango de bytes para streaming parcial (ej. "bytes=0-1023")
      responses:
        '200':
          description: Audio completo (descarga)
          content:
            audio/mpeg:
              schema:
                type: string
                format: binary
        '206':
          description: Chunk de audio (streaming parcial)
          content:
            audio/mpeg:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/UnexpectedError'
  /voice-notes:
    get:
      summary: obtener voiceNotes
      operationId: getVoiceNotes
      parameters:
        - $ref: '#/components/parameters/pageNumberQueryParam'
        - $ref: '#/components/parameters/pageSizeQueryParam'
        - $ref: '#/components/parameters/sortByQueryParam'
        - $ref: '#/components/parameters/spaceNameQueryParam'
      responses:
        '200':
          $ref: '#/components/responses/VoiceNoteResponseList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/UnexpectedError'
      tags:
        - voice-notes
    post:
      summary: upload a new voice note
      operationId: uploadNoteVoice
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: Archivo MP3
                spaceId:
                  type: integer
                  format: int64
                nombre:
                  type: string
                  example: nombre de prueba
                description:
                  type: string
                  example: esto es una descripcion generica
              required:
                - file
                - spaceId
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/UnexpectedError'
      tags:
        - voice-notes
  /spaces/user-space-role:
    post:
      summary: create a new user space role
      operationId: createUserSpaceRole
      requestBody:
        $ref: '#/components/requestBodies/UserSpaceRoleCreateRequestBody'
      responses:
        '201':
          $ref: '#/components/responses/UserSpaceRoleResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/UnexpectedError'
      tags:
        - spaces
  /spaces:
    post:
      summary: create a new space
      operationId: createSpace
      requestBody:
        $ref: '#/components/requestBodies/SpaceCreateRequestBody'
      responses:
        '201':
          $ref: '#/components/responses/SpaceResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/UnexpectedError'
      tags:
        - spaces
  /spaces/{spaceId}:
    get:
      summary: get a space by id
      operationId: getSpaceById
      parameters:
        - $ref: '#/components/parameters/spaceId'
      responses:
        '200':
          $ref: '#/components/responses/SpaceResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/UnexpectedError'
      tags:
        - spaces
  /tags/add-tag-space:
    patch:
      summary: add a tag to a space
      operationId: addTagToSpace
      requestBody:
        $ref: '#/components/requestBodies/TagSpaceCreateRequestBody'
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/UnexpectedError'
      tags:
        - tags
  /tags:
    post:
      summary: create a new tag
      operationId: createTag
      requestBody:
        $ref: '#/components/requestBodies/TagCreateRequestBody'
      responses:
        '201':
          $ref: '#/components/responses/TagResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/UnexpectedError'
      tags:
        - tags
  /tags/{tagId}:
    get:
      summary: get a tag by id
      operationId: getTagById
      parameters:
        - $ref: '#/components/parameters/tagId'
      responses:
        '200':
          $ref: '#/components/responses/TagResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/UnexpectedError'
      tags:
        - tags
  /users/test:
    get:
      summary: endpoint publico test
      operationId: getTest
      responses:
        '200':
          $ref: '#/components/responses/ReponseTest'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/UnexpectedError'
  /login:
    post:
      summary: Login de un user
      operationId: login
      requestBody:
        $ref: '#/components/requestBodies/AuthenticationRequestBody'
      responses:
        '200':
          $ref: '#/components/responses/AuthenticationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/UnexpectedError'
      tags:
        - auth
  /register:
    post:
      summary: Register de un user
      operationId: register
      requestBody:
        $ref: '#/components/requestBodies/RegisterRequestBody'
      responses:
        '200':
          $ref: '#/components/responses/AuthenticationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/UnexpectedError'
      tags:
        - auth
components:
  requestBodies:
    TagSpaceCreateRequestBody:
      description: Registrar un user
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TagSpaceRequestDTO'
    UserSpaceRoleCreateRequestBody:
      description: Registrar un user
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UserSpaceRoleRequestDTO'
    AuthenticationRequestBody:
      description: Login de un user
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthenticationRequestDTO'
          example:
            email: "usuario@ejemplo.com"
            password: "123456"
    RegisterRequestBody:
      description: Registrar un user
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RegisterRequestDTO'
    TagCreateRequestBody:
      description: Create a new tag
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TagCreateDTO'
    SpaceCreateRequestBody:
      description: Create a new space
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SpaceCreateDTO'

  parameters:
    tagId:
      name: tagId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/genericId'
    spaceId:
      name: spaceId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/genericId'
    pageNumberQueryParam:
      name: pageNumberQueryParam
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/pageNumberQueryParam'
    pageSizeQueryParam:
      name: pageSizeQueryParam
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/pageSizeQueryParam'
    nameQueryParam:
      name: nameQueryParam
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/nameQueryParam'
    sortByQueryParam:
      name: sortByQueryParam
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/sortByQueryParam'
    spaceNameQueryParam:
      name: spaceNameQueryParam
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/spaceNameQueryParam'
    linkedCodePathParam:
      name: linkedCodePathParam
      in: path
      required: true
      schema:
        type: string
    ownerIdPathParam:
      name: ownerIdPathParam
      in: path
      required: true
      schema:
        type: integer
        format: int64
    userIdPathParam:
      name: userId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    subscriptionIdPathParam:
      name: subscriptionId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    companyIdPathParam:
      name: companyId
      in: path
      required: true
      schema:
        type: integer
        format: int64
  responses:
    VoiceNoteResponseList:
      description: OK.
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/VoiceNoteDTO'
    UserSpaceRoleResponse:
      description: OK.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UserSpaceRoleDTO'
    SpaceResponse:
      description: OK.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SpaceDTO'
    TagResponse:
      description: OK.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TagDTO'
    ReponseTest:
      description: OK.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TestDTO'
    ListUsersResponse:
      description: OK.
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/UserDTO'
    AuthenticationResponse:
      description: OK.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthenticationDTO'
    ResponseListUserDTO:
      description: OK.
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/UserDTO'
    ResponseUserDTO:
      description: OK.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UserDTO'
    SubscriptionResponse:
      description: OK.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SubscriptionDTO'
    SubscriptionListResponse:
      description: OK.
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/SubscriptionDTO'
    CompanyResponse:
      description: OK.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CompanyDTO'
    CompanyListResponse:
      description: OK.
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/CompanyDTO'
    PagedResponseUserDTO:
      description: OK.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PagedResponseUserDTO'
    NoContent:
      description: No Content
    BadRequest:
      description: Bad Request
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/Problem'
          example:
            '400':
              value:
                type: 'https://api.example.com/problems/validation-error'
                status: 400
                title: Validation Error
                detail: >-
                  One or more fields are invalid. See details for more information.
                instance: 'https://api.example.com/problems/validation-error/12345'
    Unauthorized:
      description: Bad Request
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/Problem'
          example:
            '400':
              value:
                type: 'https://api.example.com/problems/validation-error'
                status: 401
                title: Validation Error
                detail: >-
                  One or more fields are invalid. See details for more information.
                instance: 'https://api.example.com/problems/validation-error/12345'
    Forbidden:
      description: Bad Request
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/Problem'
          example:
            '400':
              value:
                type: 'https://api.example.com/problems/validation-error'
                status: 403
                title: Validation Error
                detail: >-
                  One or more fields are invalid. See details for more information.
                instance: 'https://api.example.com/problems/validation-error/12345'
    NotFound:
      description: Bad Request
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/Problem'
          example:
            '400':
              value:
                type: 'https://api.example.com/problems/validation-error'
                status: 404
                title: Validation Error
                detail: >-
                  One or more fields are invalid. See details for more information.
                instance: 'https://api.example.com/problems/validation-error/12345'
    UnexpectedError:
      description: Bad Request
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/Problem'
          example:
            '400':
              value:
                type: 'https://api.example.com/problems/validation-error'
                status: 404
                title: Validation Error
                detail: >-
                  One or more fields are invalid. See details for more information.
                instance: 'https://api.example.com/problems/validation-error/12345'
  schemas:
    UserSpaceRoleDTO:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/genericId'
        userId:
          $ref: '#/components/schemas/genericId'
        spaceId:
          $ref: '#/components/schemas/genericId'
        role:
          $ref: '#/components/schemas/RoleUserSpace'
    VoiceNoteDTO:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/genericId'
        nombre:
          type: string
          example: 'Francisco'
        description:
          type: string
          example: 'Esto es una prueba de descripcion'
        duration:
          type: integer
          example: 45
        spaceName:
          type: string
          example: 'universe'
        uploadedById:
          $ref: '#/components/schemas/genericId'
        spaceId:
          $ref: '#/components/schemas/genericId'
    NotificationDto:
      type: object
      properties:
        emailTo:
          type: string
          example: user@user.com
        subject:
          type: string
          example: Notificación suscripción
        text:
          type: string
          example: Texto de ejemplo del correo
        notificationType:
          type: string
          example: END_SUBSCRIPTION
        isSended:
          type: boolean
          example: false
    PagedResponseUserDTO:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/UserDTO'
        number:
          type: integer
          example: 1
        size:
          type: integer
          example: 25
        totalElements:
          type: integer
          format: int64
          example: 232
        totalPages:
          type: integer
          example: 23
    UserDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 12345
        email:
          type: string
          example: user@user.com
        firstname:
          type: string
          example: Luis
        lastname:
          type: string
          example: Perez
        isEmailActive:
          type: boolean
          example: false
        role:
          type: string
          example: USER
    AuthenticationRequestDTO:
      type: object
      properties:
        email:
          type: string
          example: friasgilivan@gmail.com
        password:
          type: string
          example: 123456
    TestDTO:
      type: object
      properties:
        version:
          type: string
          example: 0.0.2
    TagCreateDTO:
      type: object
      properties:
        name:
          type: string
          example: universidad
    SpaceCreateDTO:
      type: object
      properties:
        name:
          type: string
          example: my-space
        description:
          type: string
          example: my description
    TagDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: universidad
    SpaceDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: universidad
        description:
          type: string
          example: description
    TagSpaceRequestDTO:
      type: object
      properties:
        tagId:
          $ref: '#/components/schemas/genericId'
        spaceId:
          $ref: '#/components/schemas/genericId'
    UserSpaceRoleRequestDTO:
      type: object
      properties:
        userId:
          $ref: '#/components/schemas/genericId'
        spaceId:
          $ref: '#/components/schemas/genericId'
        role:
          $ref: '#/components/schemas/RoleUserSpace'
    RegisterRequestDTO:
      type: object
      properties:
        email:
          type: string
          example: friasgilivan@gmail.com
        password:
          type: string
          example: 123456
        firstname:
          type: string
          example: 123456
        lastname:
          type: string
          example: 123456
        role:
          $ref: '#/components/schemas/RoleUser'
    AuthenticationDTO:
      type: object
      properties:
        token:
          type: string
          example: eyJhbGciOiJIUzI1NiJ9.eyJmaXJzdG5hbW...
    RoleUser:
      type: string
      enum:
        - USER
        - ADMIN
      description: Role de los users de la app
    RoleUserSpace:
      type: string
      enum:
        - ADMIN
        - MEMBER
      description: Role de los users de la app
    Problem:
      type: object
      properties:
        error:
          type: string
    genericId:
      title: example
      description: example
      type: integer
      format: int64
      minimum: 1
      maximum: 999999999999
      example: 1
    userId:
      title: example
      description: example
      type: integer
      format: int64
      minimum: 1
      maximum: 999999999999
      example: 1
    sortByQueryParam:
      type: string
      example: "productName"
    spaceNameQueryParam:
      type: string
      example: "universe"
    pageNumberQueryParam:
      title: example
      description: example
      type: integer
      minimum: 1
      maximum: 99999
      example: 1
    pageSizeQueryParam:
      title: example
      description: example
      type: integer
      minimum: 5
      maximum: 500
      example: 1
    nameQueryParam:
      type: string
      example: "Joaquin"
    CreateSubscriptionRequestDTO:
      type: object
      properties:
        userId:
          type: integer
          format: int64
          example: 123
        startDate:
          type: string
          format: date
          example: "2024-01-01"
        durationInMonths:
          type: integer
          minimum: 1
          maximum: 120
          example: 12
      required:
        - userId
        - startDate
        - durationInMonths
    SubscriptionDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        userId:
          type: integer
          format: int64
          example: 123
        companyId:
          type: integer
          format: int64
          example: 123
        startDate:
          type: string
          format: date
          example: "2024-01-01"
        endDate:
          type: string
          format: date
          example: "2024-12-31"
      required:
        - id
        - userId
        - startDate
        - endDate
    CreateCompanyRequestDTO:
      type: object
      properties:
        name:
          type: string
          example: "Mi Empresa S.L."
      required:
        - name
    CompanyDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: "Mi Empresa S.L."
        ownerId:
          type: integer
          format: int64
          example: 123
        linkCode:
          type: string
          example: "eK408wX6pf"
      required:
        - id
        - name
        - ownerId

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT